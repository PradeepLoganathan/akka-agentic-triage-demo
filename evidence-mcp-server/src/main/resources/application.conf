# Evidence MCP Server Configuration

# Service identification (IMPORTANT for service discovery)
# This service provides evidence gathering tools for operational data:
#   LOG TOOLS: fetch_logs - Service log fetching and analysis
#   METRICS TOOLS: query_metrics - Performance metrics querying
#   KNOWLEDGE BASE TOOLS: get_known_services - Service catalog
#   ANALYSIS TOOLS: correlate_evidence - Cross-evidence correlation
#
# Represents: Splunk, Datadog, Prometheus, CloudWatch-like systems
# All tools are discoverable at /mcp via JSON-RPC protocol
akka.javasdk.dev-mode {
  service-name = "evidence-mcp-server"  # This must match RemoteMcpTools.fromService("evidence-mcp-server")
  http-port = 9200  # Evidence server port
}

# Logging configuration
akka.loglevel = "DEBUG"  # Enable DEBUG for detailed logging
akka.loggers = ["akka.event.slf4j.Slf4jLogger"]
akka.logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
akka.log-config-on-start = off

# Enable detailed HTTP logging (helpful for debugging JSON-RPC messages)
akka.http.server.log-unencrypted-network-bytes = 100000  # Log up to 100KB of request/response

# HTTP server timeouts
akka.http.server {
  request-timeout = 60s
  idle-timeout = 120s
  preview.enable-http2 = on
}
