# Knowledge Base MCP Server Configuration

# Service identification (IMPORTANT for service discovery)
# This service provides knowledge base and documentation resources:
#   RESOURCES: kb://runbooks/{serviceName} - Service-specific troubleshooting runbooks
#   TOOLS: search_kb (future) - Semantic search across documentation
#
# Represents: Confluence, SharePoint, Jira, ServiceNow-like systems
# Contains PII data in runbooks for guardrail demonstration
# All resources/tools are discoverable at /mcp via JSON-RPC protocol
akka.javasdk.dev-mode {
  service-name = "knowledge-base-mcp-server"  # This must match RemoteMcpResources.fromService("knowledge-base-mcp-server")
  http-port = 9300  # Knowledge Base server port
}

# Logging configuration
akka.loglevel = "DEBUG"  # Enable DEBUG for detailed logging
akka.loggers = ["akka.event.slf4j.Slf4jLogger"]
akka.logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
akka.log-config-on-start = off

# Enable detailed HTTP logging (helpful for debugging JSON-RPC messages)
akka.http.server.log-unencrypted-network-bytes = 100000  # Log up to 100KB of request/response

# HTTP server timeouts
akka.http.server {
  request-timeout = 60s
  idle-timeout = 120s
  preview.enable-http2 = on
}
